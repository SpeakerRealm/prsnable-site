const c=document.querySelector('canvas'),ctx=c.getContext('2d'),$=id=>document.getElementById(id);let W,H,D,mode='intro',scene=0,start=performance.now(),mx=0,my=0,muted=true,reduced=matchMedia('(prefers-reduced-motion: reduce)').matches,ac,osc,gain,question=0,answers=[],agent='';const particles=Array.from({length:2600},(_,i)=>{let u=(i+.5)/2600,v=i*2.399963;return {x:Math.sqrt(1-(2*u-1)**2)*Math.cos(v),y:2*u-1,z:Math.sqrt(1-(2*u-1)**2)*Math.sin(v),r:Math.random(),a:Math.random()*6.28}});function resize(){D=Math.min(devicePixelRatio,1.7);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;ctx.setTransform(D,0,0,D,0,0)}resize();addEventListener('resize',resize);addEventListener('pointermove',e=>{mx=(e.clientX/W-.5)*2;my=(e.clientY/H-.5)*2});const scenes=[['01 / THE SILENCE','What if you could become more?','Move your cursor. The world is already responding to you.'],['02 / THE WEIGHT','The same twenty-four hours.','Responsibilities. Relationships. Ambitions. Unfinished ideas.'],['03 / THE EMERGENCE','An agent of your own.','An intelligence that learns you, works for you and earns your trust.'],['04 / THE POSSIBILITIES','More of you. Less on you.','Reclaim your time. Strengthen your relationships. Pursue your ambitions.'],['05 / THE REVEAL','Everyone deserves an agent.','Meet an intelligence designed around you.']];const times=[0,6000,13000,21000,29000];function intro(){let s=scenes[scene];$('content').innerHTML=`<div class="eyebrow">${s[0]}</div><h1>${s[1]}</h1><p>${s[2]}</p><button class="primary" onclick="${scene===4?'begin()':'advance()'}">${scene===4?'Begin your journey →':'Continue →'}</button>`;if(!muted)speak(s[1]+'. '+s[2]);}function advance(){if(scene<4){scene++;start=performance.now()-times[scene];intro()}else begin()}function speak(t){if(!muted&&'speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.rate=.83;u.pitch=.85;speechSynthesis.speak(u)}}$('sound').onclick=()=>{muted=!muted;$('sound').textContent=muted?'Sound off':'Sound on';if(muted){window.speechSynthesis?.cancel();if(gain)gain.gain.value=0}else{try{ac??=new AudioContext();ac.resume();if(!osc){osc=ac.createOscillator();gain=ac.createGain();osc.type='sine';osc.frequency.value=55;osc.connect(gain).connect(ac.destination);osc.start()}gain.gain.value=.035}catch{}if(mode==='intro')speak(scenes[scene][1])}};$('motion').textContent=reduced?'Motion off':'Motion on';$('motion').onclick=()=>{reduced=!reduced;$('motion').textContent=reduced?'Motion off':'Motion on'};$('skip').onclick=()=>begin();const qs=['What do you want more of in your life?','What takes up too much of your time?','What goal would you pursue if you had more capacity?','How do you prefer to communicate?','When are you at your best?','What tends to get in your way?','Which relationships matter most to you?','What would you delegate first?','How proactive should your agent be?','What should your agent never do without asking?','What would a successful week look like?','What is one thing we could help you accomplish today?'];function begin(){mode='onboard';question=0;answers=[];$('skip').textContent='Restart';$('skip').onclick=()=>location.reload();showQ()}function showQ(){$('chapter').textContent='02 / BECOMING';$('progress').style.width=(question/12*100)+'%';$('content').innerHTML=`<section class="panel"><div class="eyebrow">Becoming · ${question+1} of 12</div><h1>${qs[question]}</h1><p class="small">Your answers shape your agent. This demo keeps them in this browser session only.</p><form id="qform"><input id="answer" autocomplete="off" placeholder="Tell me in your own words…" required maxlength="300"><button class="primary">Continue →</button></form></section>`;$('qform').onsubmit=e=>{e.preventDefault();answers.push($('answer').value.trim());question++;question<12?showQ():nameAgent()};speak(qs[question])}function nameAgent(){mode='name';$('content').innerHTML='<section class="panel"><div class="eyebrow">A new relationship</div><h1>Give your agent a name.</h1><p>One intelligence. A relationship that grows with you.</p><form id="nform"><input id="name" required maxlength="30" placeholder="Your agent’s name"><button class="primary">Awaken my agent →</button></form></section>';$('nform').onsubmit=e=>{e.preventDefault();agent=$('name').value.trim();dashboard()}}function esc(s){return s.replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}function dashboard(){mode='agent';$('chapter').textContent='03 / YOUR AGENT';$('progress').style.width='100%';$('content').innerHTML=`<section class="panel"><div class="eyebrow status">● ${esc(agent)} · Ready to listen</div><h1>Our journey starts here.</h1><p>You've told me you want ${esc(answers[0]||'more capacity')}. Let's begin with one meaningful move.</p><div class="small">TRUST LEVEL 01 · OBSERVER · All actions require approval</div><div class="choices"><button onclick="task('brief')">Plan my day</button><button onclick="task('goal')">Help with my goal</button><button onclick="task('message')">Prepare a message</button></div><div id="result" aria-live="polite" class="small"></div></section>`;speak('Our journey starts here.')}function task(k){let t={brief:'Choose your most important priority, reserve time for it, and review your commitments.',goal:'First move: define a small achievable milestone for '+(answers[2]||'your goal')+'.',message:'First move: identify the recipient and what you want them to know.'}[k];$('result').innerHTML='<p>'+esc(t)+'</p><button onclick="this.parentElement.textContent=\'Approved in this demo. No external action was taken.\'">Approve suggested move</button>'}intro();function frame(now){let t=reduced?0:now*.00032;if(mode==='intro'&&!reduced){let e=now-start;let n=times.filter(x=>e>=x).length-1;if(n>scene){scene=n;intro()}$('progress').style.width=Math.min(100,e/350)+'%'}ctx.fillStyle='#05060b';ctx.fillRect(0,0,W,H);let cx=W/2,cy=H*(mode==='intro'?.39:.29),R=Math.min(W,H)*(.23+(scene===2?.04:0));let halo=ctx.createRadialGradient
