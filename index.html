const orbPtsCache={};
function orbPoints(n){if(!orbPtsCache[n])orbPtsCache[n]=Array.from({length:n},(_,i)=>{const y=1-2*(i+.5)/n,a=i*2.399963,r=Math.sqrt(1-y*y);return[r*Math.cos(a),y,r*Math.sin(a)]});return orbPtsCache[n]}

function orbDrawOne(cv,mini){if(!cv)return;const g=cv.getContext&&cv.getContext('2d');if(!g)return;const w=cv.clientWidth||cv.width,h=cv.clientHeight||cv.height;if(!w||!h)return;const d=Math.min(window.devicePixelRatio||1,2);const bw=Math.round(w*d),bh=Math.round(h*d);if(cv.width!==bw||cv.height!==bh){cv.width=bw;cv.height=bh}g.setTransform(d,0,0,d,0,0);g.clearRect(0,0,w,h);const col=ORB_COLOR[orbState]||ORB_COLOR.available;const cx=w/2,cy=h/2;let pulse=1;if(!reduced){if(orbState==='listening'||orbState==='speaking')pulse=1+talkAmp*.5;else if(orbState==='thinking'||orbState==='working')pulse=1+.05*Math.sin(orbT*5);else if(orbState==='approval'||orbState==='completed')pulse=1+.04*Math.sin(orbT*3);else pulse=1+.02*Math.sin(orbT*2)}const R=Math.min(w,h)*.40*pulse;const glow=g.createRadialGradient(cx,cy,0,cx,cy,R*1.6);glow.addColorStop(0,`rgba(${col[0]},${col[1]},${col[2]},.14)`);glow.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=glow;g.fillRect(0,0,w,h);const n=mini?220:(w<520?420:1000);const pts=orbPoints(n);const a=orbT*(orbState==='working'||orbState==='thinking'?.9:.25),ca=Math.cos(a),sa=Math.sin(a);for(let i=0;i<pts.length;i++){const p=pts[i];const xx=p[0]*ca-p[2]*sa,zz=p[0]*sa+p[2]*ca;g.beginPath();g.arc(cx+xx*R,cy+p[1]*R,(mini?.8:0.35)+(zz+1)*(mini?.5:.55),0,7);g.fillStyle=`rgba(${col[0]},${col[1]},${col[2]},${.12+(zz+1)*.42})`;g.fill()}}

function renderPermissions(){const box=$('permbox');if(!box)return;const groups={};for(const c of youCaps){(groups[c.group]=groups[c.group]||[]).push(c)}box.innerHTML=`<div class="card"><h3>What your agent may do</h3><p class="lead">Every permission is separate, and each has its own level. Nothing here is all-or-nothing.</p><p class="small">The levels: Not allowed · Observer (can look, never act) · Collaborator (can prepare, you decide) · Executor (acts, with your go-ahead for anything that sends or changes things) · Proactive (acts within what you've allowed) · Representative (acts for you at the fullest level).</p>${GROUP_ORDER.filter(([g])=>groups[g]).map(([g,label])=>`<h4>${label}</h4>${groups[g].map(c=>`<div class="trustrow" id="caprow-${esc(c.capability)}"><p class="conntext"><b>${esc(capLabel(c.capability))}:</b> ${esc(levelWord(c))}</p><div class="actions"><button onclick="editCap('${esc(c.capability)}')">Change</button></div></div>`).join('')}`).join('')}<p class="small">Saving applies exactly the levels in this list. Setting one to Not allowed takes it away.</p><p class="small" id="permmsg"></p></div>`}

let todayData=null,todayLoaded=false;
function todayDayBounds(){const now=new Date();const start=new Date(now.getFullYear(),now.getMonth(),now.getDate());const end=new Date(start.getTime()+24*60*60*1000);return{time_min:start.toISOString(),time_max:end.toISOString()}}
function fmtTime(iso){if(!iso)return'';const d=new Date(iso);if(isNaN(d))return'';if(!/T/.test(iso))return'All day';return d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}
function fmtRange(ev){const a=fmtTime(ev.start),b=fmtTime(ev.end);if(!a)return'';return b?a+' – '+b:a}
function todaySignals(events,proposals){
  const sigs=[];const now=Date.now();
  const timed=events.filter(e=>e.start&&/T/.test(e.start)).map(e=>({e,s:new Date(e.start).getTime(),en:e.end&&/T/.test(e.end)?new Date(e.end).getTime():new Date(e.start).getTime()})).filter(x=>!isNaN(x.s)).sort((a,b)=>a.s-b.s);
  for(let i=0;i<timed.length;i++)for(let j=i+1;j<timed.length;j++){if(timed[j].s<timed[i].en){sigs.push(`"${timed[i].e.summary}" and "${timed[j].e.summary}" overlap — you may need to choose or move one.`)}}
  for(const x of timed){const mins=Math.round((x.s-now)/60000);if(x.s>=now&&mins<=60){sigs.push(`"${x.e.summary}" starts ${mins<=1?'in under a minute':'in about '+mins+' minutes'} (${fmtTime(x.e.start)}).`)}}
  for(const pr of proposals||[]){if(pr.at){const age=now-new Date(pr.at).getTime();if(age>24*60*60*1000){sigs.push(`${capLabel(pr.capability)} has been waiting for your go-ahead since ${new Date(pr.at).toLocaleDateString([],{month:'long',day:'numeric'})}.`)}}}
  return sigs;
}

  const mission=`<div class="card"><h3>Your first mission</h3>${missionObj?`<p class="lead">${esc(missionObj)}</p><p class="meta">Status: ${esc(fmStatus==='active'?'Under way':fmStatus==='proposed'?'Set, not yet under way':fmStatus||'Set')}</p><div id="today-mission-progress"></div><div class="actions"><button onclick="shellNav('missions')">Open Missions</button></div>`:`<p class="lead">No first mission is set yet.</p><div class="actions"><button onclick="shellNav('missions')">Open Missions</button></div>`}</div>`;
  const recs=sigs.length?`<div class="card"><h3>Worth knowing</h3>${sigs.map(x=>`<p class="conntext">${esc(x)}</p>`).join('')}</div>`:'';

async function prepareDay(btn){

  for(const ev of d.events)items.push(`Appointment: "${ev.summary}"${fmtRange(ev)?' at '+fmtRange(ev):''}${ev.location?' ('+ev.location+')':''}`);
  for(const pr of d.proposals)items.push(`Waiting for my go-ahead: ${capLabel(pr.capability)}${pr.asked?' — I asked: "'+pr.asked+'"':''}`);
  if(d.mission)items.push(`My first mission: ${d.mission}`);
  if(items.length===0)return; // no real items: no briefing call, ever
  if(btn)busy(btn,'Preparing…');
  const box=$('briefingbox');
  try{
    const prompt='Prepare my day as a short briefing, spoken in your own voice, in plain words with no formatting of any kind. Use ONLY the facts listed below — every appointment, waiting item, and mission you mention must come from this list, and you must not add, invent, or assume anything that is not in it. Address me as "you".\n\n'+items.map(x=>'- '+x).join('\n');

      return;
    }

  }catch{
    if(box)box.innerHTML=`<p class="lead">Your briefing could not be prepared just now. Your appointments and waiting items below are still the whole picture.</p>`;
  }
}

let missionsData=null,missionsLoaded=false,impactData=null;
function fmtMinutes(mins){if(mins==null)return'';if(mins<60)return mins+' minutes';const h=Math.floor(mins/60),m=mins%60;return 'about '+h+(h===1?' hour':' hours')+(m?' '+m+' minutes':'')}
function fmtDay(iso){if(!iso)return'';const d=new Date(iso);return isNaN(d)?'':d.toLocaleDateString([],{year:'numeric',month:'long',day:'numeric'})}
function missionById(id){return missionsData&&Array.isArray(missionsData.missions)?missionsData.missions.find(m=>m.mission_id===id)||null:null}
function progressLine(m){

  if(!m.progress)return 'No steps yet. Add a first step and check steps off as you go — that is how progress is counted here.';

async function saveMission(id,btn){
  const title=$('med-title').value.trim();
  if(!title){$('medmsg').textContent='Give the mission a name first.';return}
  const lines=v=>v.split('\n').map(x=>x.trim()).filter(Boolean);
  const stepTexts=lines($('med-steps').value);
  const cur=id?missionById(id):null;
  const milestones=stepTexts.map(text=>{const prev=cur?(cur.milestones||[]).find(st=>st.text===text):null;return prev?{id:prev.id,text,done:prev.done}:{text,done:false}});
  const estRaw=$('med-est').value.trim();
  const body={title,objective:$('med-objective').value.trim()||null,milestones,dependencies:lines($('med-deps').value),status:$('med-status').value,estimate_minutes:estRaw?Number(estRaw):null};
  busy(btn,'Saving…');
  try{
    const r=id?await api(API_MISS,'/missions/update',{method:'POST',body:{mission_id:id,...body}}):await api(API_MISS,'/missions',{method:'POST',body});
    if(r.status===401){clearToken();showAuth('in','Your session has expired. Sign in again.');return}
    if(r.status!==200){$('medmsg').textContent=serverMsg(r,'That mission was not saved.');btn.disabled=false;btn.textContent='Save mission';return}
    loadMissions();
  }catch(err){$('medmsg').textContent=err.message;btn.disabled=false;btn.textContent='Save mission'}
}

  const inp=$('newstep-'+mid);if(!inp||!inp.value.trim())return;
  busy(btn,'Adding…');
  try{const r=await api(API_MISS,'/missions/milestones',{method:'POST',body:{mission_id:mid,action:'add',text:inp.value.trim()}});if(r.status===401){clearToken();showAuth('in','Your session has expired. Sign in again.');return}}catch{}
  loadMissions();
}
async function completeMission(mid,btn){
  busy(btn,'Finishing…');
  try{const r=await api(API_MISS,'/missions/complete',{method:'POST',body:{mission_id:mid}});if(r.status===401){clearToken();showAuth('in','Your session has expired. Sign in again.');return}}catch{}
  loadMissions();loadImpact();
}
async function reopenMission(mid,btn){
  busy(btn,'Reopening…');
  try{await api(API_MISS,'/missions/update',{method:'POST',body:{mission_id:mid,status:'active'}})}catch{}
  loadMissions();loadImpact();
}
async function deleteMission(mid,btn){
  if(window.confirm&&!window.confirm('Delete this mission? Anything you made for it stays in My Creations.'))return;
  busy(btn,'Deleting…');
  try{await api(API_MISS,'/missions/delete',{method:'POST',body:{mission_id:mid}})}catch{}
  loadMissions();
}
function talkAboutMission(mid){
  const m=missionById(mid);
  shellNav('agent');
  const inp=$('talktext');
  if(inp&&m){inp.value='About my mission “'+m.title+'”: ';if(inp.focus)inp.focus()}
}
function renderCreations(){
  const box=$('creationsbox');if(!box||!missionsData)return;
  const ds=missionsData.deliverables||[];
  const nameOf=id=>{const m=missionById(id);return m?m.title:null};
  box.innerHTML=`<div class="card"><h3>My Creations</h3><p class="lead">Your own record of what you've made. PRSNABLE doesn't keep the files themselves — if something lives somewhere, add its link.</p>${ds.length?ds.map(d=>`<p class="conntext"><b>${esc(d.title)}</b>${d.description?` — ${esc(d.description)}`:''}${d.link?` · <a href="${esc(d.link)}" target="_blank" rel="noopener">Open it</a>`:''}<br><span class="small">${d.mission_id&&nameOf(d.mission_id)?'Made for: '+esc(nameOf(d.mission_id)):'Not tied to a mission'}${!d.description&&!d.link?' · Just a title so far — your note of what you made.':''}</span></p><div class="actions"><button onclick="deleteCreation('${esc(d.deliverable_id)}',this)">Remove</button></div>`).join(''):'<p class="conntext">Nothing here yet. When you make something — for a mission or on its own — note it here.</p>'}<h4>Add something you made</h4><label class="small">What is it?</label><input id="crt-title" placeholder="Name it"><label class="small">A few words about it (optional)</label><input id="crt-desc" placeholder="Describe it briefly"><label class="small">Link, if it lives somewhere (optional)</label><input id="crt-link" placeholder="https://…"><label class="small">For which mission? (optional)</label><select id="crt-mission"><option value="">Not tied to a mission</option>${(missionsData.missions||[]).map(m=>`<option value="${esc(m.mission_id)}">${esc(m.title)}</option>`).join('')}</select><div class="actions"><button class="primary" onclick="addCreation(this)">Add to My Creations</button></div><p class="small" id="crtmsg"></p></div>`;
}
async function addCreation(btn){
  const title=$('crt-title').value.trim();
  if(!title){$('crtmsg').textContent='Name what you made first.';return}
  busy(btn,'Adding…');
  try{
    const mid=$('crt-mission').value;
    const r=await api(API_MISS,'/missions/deliverables',{method:'POST',body:{mission_id:mid||null,title,description:$('crt-desc').value.trim()||null,link:$('crt-link').value.trim()||null}});
    if(r.status===401){clearToken();showAuth('in','Your session has expired. Sign in again.');return}
    if(r.status!==200){$('crtmsg').textContent=serverMsg(r,'That was not added.');btn.disabled=false;btn.textContent='Add to My Creations';return}
    loadMissions();
  }catch(err){$('crtmsg').textContent=err.message;btn.disabled=false;btn.textContent='Add to My Creations'}
}
async function deleteCreation(id,btn){
  busy(btn,'Removing…');
  try{await api(API_MISS,'/missions/deliverables/delete',{method:'POST',body:{deliverable_id:id}})}catch{}
  loadMissions();
}
const WORK_WORDS={gmail_read:['read your email','reading your email'],calendar_read:['checked your calendar','checking your calendar']};
function workLine(kind,count){
  const w=WORK_WORDS[kind];
  const what=w?w[0]:kind.replace(/_/g,' ');
  if(count===1)return 'Your agent '+what+' once.';
  if(count===2)return 'Your agent '+what+' twice.';
  return 'Your agent '+what+' '+count+' times.';
}
async function loadImpact(){
  const box=$('impactbox');if(!box)return;
  let completed=null,activity=null;
  try{const r=await api(API_MISS,'/missions/completed');if(r.status===200)completed=r.json.completed||[]}catch{}
  try{const r=await api(API_TALK,'/talk/activity');if(r.status===200)activity=r.json}catch{}
  if(completed===null&&activity===null){box.innerHTML=`<div class="card"><h3>Life Reclaimed</h3><p class="lead">What has been done could not be read just now.</p><div class="actions"><button onclick="loadImpact()">Try again</button></div></div>`;return}
  completed=completed||[];
  const tools=activity&&activity.tools_run?activity.tools_run:{total:0,by_kind:{}};
  const kinds=Object.entries(tools.by_kind||{});
  impactData={completed,activity};
  if(!completed.length&&!tools.total){
    box.innerHTML=`<div class="card"><h3>Nothing here yet</h3><p class="lead">Nothing has been finished yet, and your agent hasn't done any work for you yet. When you finish a mission, it will be listed here with the day you finished it. When your agent does real work for you — like reading your email or checking your calendar — that will be counted here too, exactly as it happened.</p><div class="actions"><button class="primary" onclick="shellNav('missions')">Open Missions</button></div></div>`;
    return;
  }
  let html=`<div class="card"><h3>Done, and counted</h3><p class="lead">Everything here comes straight from your records — missions you marked complete, and work your agent actually did.</p>`;
  if(completed.length){html+=completed.map(m=>`<p class="conntext">You finished <b>${esc(m.title)}</b>${m.completed_at?' on '+esc(fmtDay(m.completed_at)):''}.</p>`).join('')}
  if(kinds.length){html+=kinds.map(([k,c])=>`<p class="conntext">${esc(workLine(k,c))}</p>`).join('')}
  if(activity&&activity.turns){html+=`<p class="meta">Conversation turns so far: ${activity.turns}.</p>`}
  html+='</div>';
  const estimated=completed.filter(m=>m.estimate_minutes);
  if(estimated.length){
    const total=estimated.reduce((sum,m)=>sum+m.estimate_minutes,0);
    html+=`<div class="card"><h3>Estimated by you</h3><p class="lead">These are your own estimates for the missions you finished — the guesses you set, not a measurement.</p>${estimated.map(m=>`<p class="conntext"><b>${esc(m.title)}</b>: you estimated ${esc(fmtMinutes(m.estimate_minutes))}.</p>`).join('')}<p class="conntext">Your estimates add up to ${esc(fmtMinutes(total))}.</p></div>`;
  }
  box.innerHTML=html;
}
async function fillTodayMissionProgress(){
  const slot=$('today-mission-progress');if(!slot)return;
  try{
    if(!missionsData){const r=await api(API_MISS,'/missions');if(r.status===200)missionsData=r.json;else return}
    const ms=missionsData.missions||[];
    const pick=ms.find(m=>m.status==='active')||ms[0]||null;
    if(!pick)return;
    slot.innerHTML=`<p class="conntext">Mission progress: <b>${esc(pick.title)}</b> — ${esc(pick.status==='completed'?'Finished'+(pick.completed_at?' on '+fmtDay(pick.completed_at):''):pick.progress?pick.progress.done+' of '+pick.progress.total+' steps done':'no steps yet')}</p>`;
  }catch{}
}

async function fetchGreeting(){try{const r=await api(API_INTEL,'/complete',{method:'POST',body:{purpose:'reasoner',prompt:'We are meeting for the very first time, right now. Greet me warmly in two or three short sentences, in plain spoken words with no formatting of any kind. If you know my name, use it. Welcome me, and reflect back in your own words what I told you I want more of, and the first mission I set, if you know them. End by asking what I would like to take care of first.'}});if(r.status===200&&r.json&&typeof r.json.content==='string'&&r.json.content.trim())return plainSpeech(r.json.content)}catch{}return null}
async function enterAgent(){if(greetBusy)return;greetBusy=true;const greetP=fetchGreeting();const finish=async()=>{if(!greetBusy)return;greetBusy=false;window.__transDone=null;pendingGreeting=await greetP;showAgentHome()};if(reduced){await finish();return}const name=(f12AgentName||'Your agent').toUpperCase();panel(`<div class="transition" id="transition"><div class="eyebrow">Becoming · Complete</div><canvas id="transorb" aria-hidden="true"></canvas><div class="transname" id="transname">${esc(name)}</div><p class="transub">An agent of your own.</p><button type="button" id="transskip">Skip →</button></div>`);const pn=document.querySelector('.panel');if(pn)pn.classList.add('home');orbState='available';orbStart();const sk=$('transskip');if(sk)sk.onclick=()=>{finish()};window.__transDone=finish;setTimeout(()=>{finish()},3600)}
addEventListener('keydown',e=>{if(e.key==='Escape'&&window.__transDone)window.__transDone()});
async function deliverGreeting(){if(!pendingGreeting)return;const g=pendingGreeting;pendingGreeting=null;for(let i=0;i<25;i++){const log=$('talklog');if(log){talkLine('Your agent',g);orbSet(orbDerive());return}await new Promise(r=>setTimeout(r,120))}const sub=$('orbsubtitle');if(sub)sub.textContent=g}
</script></html>
