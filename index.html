function showAuth(which,note){panel(`${noteHtml(note,'err')}<div class="eyebrow">Your agent · Staging</div><h1>${which==='create'?'Create your account':'Welcome back'}</h1><p class="small">This is the real PRSNABLE agent, wired to the live staging services. ${which==='create'?'Passwords need at least 12 characters.':''}</p><form id="authform"><input id="aemail" type="email" required autocomplete="email" placeholder="Email"><input id="apass" type="password" required ${which==='create'?'minlength="12"':''} autocomplete="${which==='create'?'new-password':'current-password'}" placeholder="Password"><button class="primary" id="authgo">${which==='create'?'Create account →':'Sign in →'}</button></form><p class="small">${which==='create'?'Already have an account?':'New here?'} <a href="#" id="authtoggle">${which==='create'?'Sign in':'Create an account'}</a></p>`);$('authtoggle').onclick=e=>{e.preventDefault();showAuth(which==='create'?'in':'create')};$('authform').onsubmit=async e=>{e.preventDefault();const btn=$('authgo');busy(btn,'Working…');const email=$('aemail').value.trim(),password=$('apass').value;try{if(which==='create'){const r=await api(API_AUTH,'/auth/register',{method:'POST',body:{email,password}});if(r.status!==201){showAuth('create',serverMsg(r,'That account could not be created.'));return}}const r=await api(API_AUTH,'/auth/login',{method:'POST',body:{email,password}});if(r.status!==200||!r.json.token){showAuth(which,serverMsg(r,'Sign-in failed. Check your email and password.'));return}saveToken(r.json.token);resumeFlow()}catch(err){showAuth(which,err.message)}}}

async function talkEnsureSession(){if(talkSessionId)return talkSessionId;const r=await api(API_TALK,'/talk/session',{method:'POST',body:{}});if(r.status===401){clearToken();showAuth('in','Your session has expired. Sign in again.');throw new Error('Your session has expired.')}if(r.status!==200||!r.json)throw new Error(serverMsg(r,'The conversation could not be opened.'));talkSessionId=r.json.session_id;return talkSessionId}
async function talkButton(){if(talkState==='speaking'){await bargeIn();startListening()}else if(talkState==='listening'){stopListening(true)}else if(talkState==='idle'){talkConvo=true;talkEmptyStreak=0;startListening()}}
async function startListening(){if(talkStarting||talkState==='listening')return;talkStarting=true;try{talkAudio();if(talkCtx.state==='suspended')await talkCtx.resume();if(!talkMicStream){talkMicStream=await navigator.mediaDevices.getUserMedia({audio:true});const srcNode=talkCtx.createMediaStreamSource(talkMicStream);talkMicAnalyser=talkCtx.createAnalyser();talkMicAnalyser.fftSize=256;srcNode.connect(talkMicAnalyser)}await talkEnsureSession();talkChunks=[];const mt=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus'].find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t));talkRecorder=new MediaRecorder(talkMicStream,mt?{mimeType:mt}:undefined);talkRecorder.ondataavailable=e=>{if(e.data&&e.data.size)talkChunks.push(e.data)};talkRecorder.onerror=e=>{talkSetState('idle','The recording hit a problem ('+((e.error&&e.error.message)||'unknown error')+'). Try again, or type below instead.')};talkRecorder.onstop=()=>{if(talkChunks.length)sendAudioTurn(new Blob(talkChunks,{type:talkRecorder.mimeType||'audio/webm'}));else if(!talkDiscard){talkEmptyStreak++;if(talkConvo&&talkEmptyStreak<2){talkSetState('idle','Still listening — go ahead.');setTimeout(()=>{if(talkConvo&&talkState==='idle')startListening()},400)}else{talkConvo=false;talkSetState('idle','I did not catch any audio. Check that the microphone is on and try again, or type below instead.')}}};talkDiscard=false;talkStarting=false;talkRecorder.start();talkSetState('listening');watchSilence()}catch(err){talkStarting=false;talkConvo=false;talkSetState('idle','Microphone unavailable ('+err.message+'). You can type below instead.')}}
function stopListening(send){if(talkSilenceTimer){clearInterval(talkSilenceTimer);talkSilenceTimer=null}if(talkRecorder&&talkRecorder.state!=='inactive'){talkDiscard=!send;if(!send)talkChunks=[];talkSetState(send?'thinking':'idle');talkRecorder.stop()}else if(send){if(talkChunks.length){talkSetState('thinking');sendAudioTurn(new Blob(talkChunks,{type:(talkRecorder&&talkRecorder.mimeType)||'audio/webm'}))}else talkSetState('idle','I did not catch any audio. Check that the microphone is on and try again, or type below instead.')}else talkSetState('idle')}
function watchSilence(){if(talkSilenceTimer)clearInterval(talkSilenceTimer);talkHeardSpeech=false;talkQuietSince=0;talkListenStart=performance.now();talkSilenceTimer=setInterval(()=>{if(talkState!=='listening'){clearInterval(talkSilenceTimer);talkSilenceTimer=null;return}if(!talkMicAnalyser)return;const lvl=talkLevel(talkMicAnalyser);const now=performance.now();if(lvl>.12){talkHeardSpeech=true;talkQuietSince=0}else if(talkHeardSpeech&&lvl<.06){if(!talkQuietSince)talkQuietSince=now;else if(now-talkQuietSince>=1400){stopListening(true);return}}if(now-talkListenStart>=60000)stopListening(true)},120)}
function watchVad(){if(talkVadTimer)clearInterval(talkVadTimer);let hot=0;talkVadTimer=setInterval(()=>{if(talkState!=='speaking'||!talkMicAnalyser){hot=0;return}if(talkLevel(talkMicAnalyser)>.35){hot+=1;if(hot>=3){hot=0;bargeIn().then(()=>startListening())}}else hot=0},90)}
function playChunk(b64){const bin=atob(b64);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);const pcm=new Int16Array(bytes.buffer,bytes.byteOffset,Math.floor(bytes.byteLength/2));if(!pcm.length)return;const buf=talkCtx.createBuffer(1,pcm.length,talkFormat.sample_rate||24000);const ch=buf.getChannelData(0);for(let i=0;i<pcm.length;i++)ch[i]=pcm[i]/32768;const srcNode=talkCtx.createBufferSource();srcNode.buffer=buf;srcNode.connect(talkMaster);const at=Math.max(talkCtx.currentTime+.02,talkNextAt);srcNode.start(at);talkNextAt=at+buf.duration;talkSources.push(srcNode);srcNode.onended=()=>{talkSources=talkSources.filter(s=>s!==srcNode)}}
function stopPlayback(){for(const s of talkSources){try{s.stop()}catch{}}talkSources=[];talkNextAt=0}
async function runTurn(input){talkSetState('thinking');watchVad();try{const sid=await talkEnsureSession();talkAbort=new AbortController();const res=await fetch(API_TALK+'/talk/turn',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+sessToken},body:JSON.stringify({session_id:sid,input}),signal:talkAbort.signal});if(res.status===401){clearToken();showAuth('in','Your session has expired. Sign in again.');talkSetState('idle');return}if(res.status!==200){const j=await res.json().catch(()=>null);talkSetState('idle',((j&&(j.message||j.error))||'That turn could not run.'));return}const reader=res.body.getReader();const dec=new TextDecoder();let buffer='';for(;;){const rd=await reader.read();if(rd.done)break;buffer+=dec.decode(rd.value,{stream:true});const frames=buffer.split('\n\n');buffer=frames.pop();for(const frame of frames){if(!frame.startsWith('event:'))continue;const dl=frame.split('\n').find(l=>l.startsWith('data:'));if(!dl)continue;handleTalkEvent(JSON.parse(dl.slice(5)))}}}catch(err){if(err.name!=='AbortError'){talkSetState('idle',err.message)}}}
function handleTalkEvent(ev){if(ev.type==='member'){talkLine('You',ev.text)}else if(ev.type==='reply'){talkTurnId=ev.turn_id;talkLine('Your agent',ev.text)}else if(ev.type==='audio'){if(talkState!=='speaking')talkSetState('speaking');playChunk(ev.audio_base64)}else if(ev.type==='done'||ev.type==='interrupted'){if(talkVadTimer){clearInterval(talkVadTimer);talkVadTimer=null}talkSetState('idle');if(ev.type==='done'&&talkConvo)setTimeout(()=>{if(talkConvo&&talkState==='idle')startListening()},450)}else if(ev.type==='error'){if(talkVadTimer){clearInterval(talkVadTimer);talkVadTimer=null}talkConvo=false;talkSetState('idle','The voice failed mid-reply ('+ev.message+'). The text above is the full reply.')}}
async function bargeIn(){stopPlayback();if(talkAbort){try{talkAbort.abort()}catch{}talkAbort=null}talkSetState('thinking');if(talkSessionId&&talkTurnId){try{await api(API_TALK,'/talk/interrupt',{method:'POST',body:{session_id:talkSessionId,turn_id:talkTurnId}})}catch{}}}
async function endTalk(){talkConvo=false;if(talkState==='listening')stopListening(false);if(talkState==='speaking')await bargeIn();if(talkVadTimer){clearInterval(talkVadTimer);talkVadTimer=null}if(talkSessionId){try{await api(API_TALK,'/talk/session/end',{method:'POST',body:{session_id:talkSessionId}})}catch{}talkSessionId=null}talkSetState('idle','Conversation ended. Talk again any time.')}
function sendTyped(){const inp=$('talktext');const text=(inp&&inp.value||'').trim();if(!text||talkState==='thinking'||talkState==='speaking')return;inp.value='';talkAudio();if(talkCtx.state==='suspended')talkCtx.resume();runTurn({kind:'text',text})}
function sendAudioTurn(blob){talkEmptyStreak=0;const reader=new FileReader();reader.onload=()=>{const b64=String(reader.result).split(',')[1];if(!b64){talkSetState('idle','That recording could not be read. Try again, or type below instead.');return}runTurn({kind:'audio',audio_base64:b64,content_type:blob.type||'audio/webm',filename:'utterance.'+((blob.type||'').includes('mp4')?'m4a':'webm')})};reader.onerror=()=>{talkSetState('idle','That recording could not be read. Try again, or type below instead.')};reader.readAsDataURL(blob)}
</script></html>
